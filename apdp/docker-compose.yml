version: "3.9"

services:

  # ── Kafka (KRaft mode — no Zookeeper needed) ──────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: app_kafka
    ports:
      - "127.0.0.1:9092:9092"   # Local development client access
      - "127.0.0.1:9101:9101"   # Local JMX metrics
    environment:
      # ── KRaft identity ────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # Single node acts as both
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093  # NodeID@host:controllerPort

      # ── Listeners ─────────────────────────────────────────
      KAFKA_LISTENERS: CONTROLLER://kafka:9093,PLAINTEXT://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ── Cluster ───────────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168

      # ── KRaft requires a cluster UUID (generated once) ────
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Schema Registry ───────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: app_schema_registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # ── Kafka Topic Initializer ───────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: app_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/scripts
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]

  # ── Kafka UI (for debugging/demo) ─────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: app_kafka_ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: african-payment-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: app_redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Postgres (analytical store + dbt target) ──────────────
  postgres:
    image: postgres:15-alpine
    container_name: app_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: payment_platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d payment_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ingestion Service (FastAPI webhook receivers) ──────────
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: app_ingestion
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    volumes:
      - ./ingestion:/app/ingestion
    command: uvicorn ingestion.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Mono Open-Banking Batch Poller ────────────────────────
  # Runs the EOD bank statement pull at 23:00 WAT daily.
  # Uses supercronic for reliable cron execution in Docker.
  # Mono is batch-only — real-time reconciliation is not available
  # for direct bank-connected merchants.
  mono-batch:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: app_mono_batch
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: "postgresql://platform_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/payment_platform"
    volumes:
      - ./ingestion:/app/ingestion
    # Uses a dedicated entrypoint script to avoid shell quoting issues with
    # inline sh -c commands. Script writes the crontab and execs supercronic.
    command: ["/bin/sh", "/app/ingestion/pollers/mono_entrypoint.sh"]
    restart: unless-stopped


  # ── FX Rate Refresher ─────────────────────────────────────
  # Fetches live rates from ExchangeRate API and writes to Redis.
  # Runs immediately on startup then loops every hour.
  # Supports: USD, GBP, EUR, GHS, KES → NGN
  fx-refresher:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: app_fx_refresher
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./flink_jobs:/app/flink_jobs
    command: python /app/flink_jobs/fx_refresher.py
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: app_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.1.0
    container_name: app_grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards

  # ── Flink Normalization Job ───────────────────────────────
  flink-normalizer:
    # Apache Flink ships official Docker images for linux/amd64 only —
    # there is no upstream arm64 build for the 1.18.x line. On Apple
    # Silicon hosts Docker uses Rosetta to emulate; that works but spits
    # out a noisy platform-mismatch warning on every `docker run`.
    # Pinning the platform explicitly silences the warning AND documents
    # the intentional choice. To run natively on arm64 you'd need to
    # rebuild from a multi-arch JDK base (eclipse-temurin) and install
    # Flink from the upstream tarball — left as future work.
    platform: linux/amd64
    build:
      context: ./flink_jobs
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: app_flink_normalizer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: python /opt/flink/jobs/normalizer.py
    restart: on-failure

  # ── Telecom Batch Ingestor ────────────────────────────────
  # Watches ./telecom_data/inbox for CSV drops from dealer management
  # systems, commission engines, and AP systems. Routes by filename
  # prefix to the right raw.telecom.* topic. Processed files move to
  # ./telecom_data/archive; bad files to ./telecom_data/quarantine.
  # Drop a file in inbox/ and within 30s it lands in Kafka.
  telecom-batch:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: app_telecom_batch
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TELECOM_INBOX_DIR: /data/telecom/inbox
      TELECOM_ARCHIVE_DIR: /data/telecom/archive
      TELECOM_QUARANTINE_DIR: /data/telecom/quarantine
      TELECOM_POLL_INTERVAL_SECONDS: "30"
      METRICS_PORT: "9102"
    ports:
      - "127.0.0.1:9102:9102"   # Local Prometheus metrics (9101 is Kafka JMX)
    volumes:
      - ./ingestion:/app/ingestion
      - ./telecom_data:/data/telecom
    command: python -m ingestion.pollers.telecom_batch
    restart: on-failure

  # ── Kafka → Postgres Sink ─────────────────────────────────
  # Consumes normalized.transactions and UPSERTs into the Postgres
  # normalized.transactions table. Idempotent on transaction_id.
  # Closes the end-to-end pipeline loop (raw → normalized → queryable).
  postgres-sink:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: app_postgres_sink
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: normalized.transactions
      KAFKA_GROUP_ID: postgres-sink
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: payment_platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      METRICS_PORT: "9100"
    ports:
      - "127.0.0.1:9100:9100"   # Local Prometheus metrics
    volumes:
      - ./services:/app/services
    command: python /app/services/postgres_sink/main.py
    restart: on-failure


volumes:
  kafka_data:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

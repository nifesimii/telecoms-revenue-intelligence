name: backend-tests

# Run the FBB backend pytest suite on every push to main and every PR
# targeting main. Sample-data mode only — no Presto, no live Anthropic
# calls. The opt-in eval suite (backend/tests/test_evals.py) is skipped
# unless RUN_EVALS=1 is set, so this job stays free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      USE_SAMPLE_DATA: "true"
      # Required for module imports during test collection; never used.
      ANTHROPIC_API_KEY: "test-key-not-used"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest (sample-data mode, no evals)
        run: |
          pytest backend/tests -q
